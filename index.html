<!DOCTYPE html>
<!--
  客语乐园 · Hakka Joy — single-file Hakka (梅县话) learning app
  Romanization: 广东《客家话拼音方案》(1960, Meixian), tone numbers 1–6.

  ── HOW TO SHIP AN UPDATE ─────────────────────────────────────────────
  1. Bump APP_VERSION (semver) and add an entry at the TOP of CHANGELOG.
  2. Add new units / stories inside the CONTENT PACKS section. Give each
     new item  since:'<new version>'  so it shows a "NEW" badge.
  3. Every Hakka item carries src: P (scheme example) / W (Wiktionary
     Meixian entry) / C (composed from single-character entries) /
     I (inferred) / S (sentence built from verified words) and
     dk: DeepSeek cross-check result. Keep these honest.
  4. Commit the file to GitHub Pages. Open apps detect the newer
     version and offer a refresh.
  ──────────────────────────────────────────────────────────────────────
-->

  --border:rgba(255,255,255,.28); --border-strong:rgba(255,255,255,.6);
  --text:#ffffff; --text-dim:rgba(240,248,255,.78); --accent:#7dd3fc; --accent-2:#c4b5fd; --accent-3:#f9a8d4; --on-accent:#06223a;
  --good:#6ee7b7; --bad:#fda4af; --warn:#fde68a;

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;transition:background .5s var(--ease),color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;flex:none;display:block}
.hz{font-family:var(--font-hz)}

/* ============ ANIMATED BACKDROP ============ */
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
#bgfx .b1{width:55vmax;height:55vmax;background:var(--blob1);top:-18vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite alternate}
#bgfx .b2{width:45vmax;height:45vmax;background:var(--blob2);bottom:-18vmax;right:-12vmax;animation:drift2 30s ease-in-out infinite alternate}
#bgfx .b3{width:30vmax;height:30vmax;background:var(--blob3);top:40%;left:45%;opacity:.35;animation:drift3 22s ease-in-out infinite alternate}
html[data-theme="dark"] #bgfx i{opacity:.28}
html[data-theme="light"] #bgfx i{opacity:.45}
#bgfx .grid{position:absolute;inset:-50%;opacity:var(--grid-op);background-image:linear-gradient(rgba(120,180,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.5) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(10%);animation:gridmove 14s linear infinite}
#bgfx .stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.2px 1.2px at 40% 70%,#cdf,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.4px 1.4px at 10% 85%,#adf,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent);animation:twinkle 6s ease-in-out infinite alternate}
html[data-theme="dark"] #bgfx .stars{opacity:.7}
html[data-theme="dreamy"] #bgfx{background:linear-gradient(120deg,#ffe1f1,#e8e0ff 40%,#d9fbf3 70%,#fff0d9);background-size:300% 300%;animation:dreamshift 18s ease infinite}
html[data-theme="glass"] #bgfx{background:radial-gradient(circle at 20% 20%,#0e7490 0,transparent 45%),radial-gradient(circle at 80% 80%,#6d28d9 0,transparent 50%),linear-gradient(160deg,#0b2545,#13315c)}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vmax,-8vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-14vmax,6vmax) scale(.9)}}
@keyframes gridmove{to{background-position:0 44px,44px 0}}
@keyframes twinkle{to{opacity:.35}}
@keyframes dreamshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ============ SHELL LAYOUT ============ */
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr}
.rail{display:none}
.topbar{grid-column:1;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal));min-height:calc(56px + var(--sat));background:var(--nav-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);border-bottom:1px solid var(--border);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.brand-logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-hz);font-weight:800;font-size:19px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 18px var(--accent-mid);flex:none}
.brand-name{font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name small{display:block;font-weight:600;font-size:11px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;line-height:1.2}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-weight:700;font-size:14px;white-space:nowrap}
.chip .ic{width:18px;height:18px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:transparent;border:1px solid transparent;color:var(--text);transition:background .2s,transform .15s,border-color .2s}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border)}
.icon-btn:active{transform:scale(.92)}
.icon-btn[aria-pressed="true"]{color:var(--bad)}

#view{grid-column:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;padding:18px calc(16px + var(--sar)) calc(var(--tab-h) + var(--sab) + var(--asst-size) + 34px) calc(16px + var(--sal));scroll-behavior:smooth}
.page{max-width:1080px;margin:0 auto;animation:pagein .42s var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Bottom tab bar (portrait phones / narrow) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab-h) + var(--sab));padding:0 calc(6px + var(--sar)) var(--sab) calc(6px + var(--sal));background:var(--nav-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);border-top:1px solid var(--border)}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--text-dim);font-size:11.5px;font-weight:700;min-height:48px;transition:color .25s}
.nav-btn .ic{transition:transform .3s var(--ease)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active .ic{transform:translateY(-2px) scale(1.1)}
.tabbar .nav-btn.active::before{content:"";position:absolute;top:6px;width:44px;height:30px;border-radius:12px;background:var(--accent-soft);z-index:-1;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* Floating assistant dock (tabbar mode) */
.asst-float{position:fixed;z-index:7;right:calc(10px + var(--sar));bottom:calc(var(--tab-h) + var(--sab) + 10px);width:var(--asst-size);height:calc(var(--asst-size) + 8px)}
.asst{position:relative;width:100%;height:100%}
.asst-stage{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 60%,var(--accent-soft),transparent 68%);cursor:pointer;touch-action:manipulation}
.asst-stage canvas{width:100%!important;height:100%!important;display:block}
.asst-fallback{position:absolute;inset:8%;display:grid;place-items:center;font-size:calc(var(--asst-size)*.55);animation:bob 2.6s ease-in-out infinite;border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}
@keyframes bob{50%{transform:translateY(-6px)}}
.asst-swap{position:absolute;left:-4px;bottom:2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-solid);border:1px solid var(--border-strong);color:var(--accent);box-shadow:var(--shadow);z-index:2}
.asst-swap .ic{width:17px;height:17px}
.asst-name{display:none}

/* Rail mode: desktop OR landscape phones */
@media (min-width:900px), (orientation:landscape) and (max-height:560px){
  #app{grid-template-columns:auto 1fr}
  .rail{display:flex;flex-direction:column;grid-row:1 / span 2;grid-column:1;width:calc(84px + var(--sal));padding:calc(12px + var(--sat)) 10px calc(10px + var(--sab)) calc(10px + var(--sal));background:var(--nav-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);border-right:1px solid var(--border);z-index:6;gap:6px}
  .topbar,#view{grid-column:2}
  .tabbar,.asst-float{display:none}
  #view{padding-bottom:calc(28px + var(--sab))}
  .rail-brand{display:none;flex:none}
  .rail-nav{display:flex;flex-direction:column;gap:4px}
  .rail .nav-btn{flex-direction:column;border-radius:16px;padding:6px 4px;min-height:52px;font-size:11px}
  .rail .nav-btn.active{background:var(--accent-soft)}
  .rail .nav-btn:hover{background:var(--surface-2)}
  .rail-asst{margin-top:auto;position:relative;width:64px;height:68px;align-self:center}
  .rail-asst .asst-swap{width:32px;height:32px;left:-8px;bottom:-4px}
}
@media (orientation:landscape) and (max-height:560px){
  .topbar{min-height:calc(48px + var(--sat));padding-top:calc(4px + var(--sat));padding-bottom:4px}
  .rail{gap:2px}
  .rail .nav-btn{min-height:44px;padding:4px}
  .rail .nav-btn span{display:none}
  .rail-asst{width:60px;height:62px}
  #view{padding-top:12px}
}
@media (min-width:900px) and (min-height:561px){
  .rail{width:calc(236px + var(--sal));padding:calc(18px + var(--sat)) 14px calc(14px + var(--sab)) calc(14px + var(--sal))}
  .rail-brand{display:flex;margin:0 4px 18px}
  .topbar .brand{visibility:hidden}
  .rail .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;font-size:15px;min-height:48px}
  .rail-asst{width:100%;height:auto;aspect-ratio:1/1.05;max-height:230px;align-self:stretch;border-radius:22px;background:var(--surface);border:1px solid var(--border)}
  .rail-asst .asst-stage{border-radius:22px;inset:0 0 34px 0}
  .rail-asst .asst-name{display:block;position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:800;font-size:14px;color:var(--text-dim)}
  .rail-asst .asst-swap{left:auto;right:8px;top:8px;bottom:auto}
}

/* ============ BUBBLE ============ */
#bubble{position:fixed;z-index:8;max-width:min(320px,calc(100vw - 32px));padding:12px 14px 12px 16px;border-radius:18px;background:var(--surface-solid);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow),var(--glow);font-size:15px;line-height:1.45;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .25s,transform .3s var(--ease);pointer-events:none;right:calc(var(--asst-size) + 18px + var(--sar));bottom:calc(var(--tab-h) + var(--sab) + 14px);max-width:min(300px,calc(100vw - var(--asst-size) - 40px))}
#bubble.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
#bubble b{color:var(--accent)}
#bubble .bclose{position:absolute;top:2px;right:2px;width:30px;height:30px;border:0;background:none;color:var(--text-dim);display:grid;place-items:center}
#bubble .bclose .ic{width:16px;height:16px}
#bubble .btxt{padding-right:18px}
@media (min-width:900px), (orientation:landscape) and (max-height:560px){
  #bubble{right:auto;left:calc(96px + var(--sal));bottom:calc(16px + var(--sab));max-width:min(320px,calc(100vw - 120px))}
}
@media (min-width:900px) and (min-height:561px){ #bubble{left:calc(250px + var(--sal))} }

/* ============ COMPONENTS ============ */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);backdrop-filter:blur(var(--blur)) saturate(140%)}
html[data-theme="glass"] .card{background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:var(--glow)}
html[data-theme="glass"] .card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.h-title{font-size:clamp(22px,4.6vw,30px);font-weight:900;margin:0 0 4px;letter-spacing:.3px}
.h-sub{color:var(--text-dim);margin:0 0 16px}
.sec-title{font-size:18px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);font-weight:800;font-size:15px;transition:transform .15s,box-shadow .25s,background .25s,opacity .2s;white-space:nowrap}
.btn:hover{box-shadow:var(--glow)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 8px 24px var(--accent-mid)}
.btn.good{background:var(--good);color:#04130c;border-color:transparent}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-mid)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{width:19px;height:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.4px;vertical-align:middle}
.badge.new{background:linear-gradient(135deg,var(--accent-3),var(--accent-2));color:#fff;animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25)}}
.badge.src-W,.badge.src-P{background:var(--good-soft);color:var(--good)}
.badge.src-C{background:var(--accent-soft);color:var(--accent)}
.badge.src-I,.badge.src-S{background:var(--warn-soft);color:var(--warn)}
.badge.dk-diff{background:var(--bad-soft);color:var(--bad)}
.bar{height:9px;border-radius:99px;background:var(--text-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .8s var(--ease)}
.muted{color:var(--text-dim)}
.small{font-size:13px}
.center{text-align:center}

/* Pinyin with tone colors */
.py{font-family:ui-rounded,"SF Pro Rounded",var(--font);font-weight:700;letter-spacing:.3px}
.py sup{font-size:.62em;margin-left:1px;font-weight:800}
.tonecolor .tn1{color:var(--t1)}.tonecolor .tn2{color:var(--t2)}.tonecolor .tn3{color:var(--t3)}
.tonecolor .tn4{color:var(--t4)}.tonecolor .tn5{color:var(--t5)}.tonecolor .tn6{color:var(--t6)}
.py .tl{font-family:var(--font);font-weight:400;margin-left:1px;opacity:.85}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(24px,5.4vw,36px);margin:2px 0 6px;font-weight:900;line-height:1.15}
.hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:1px}
.hero p{margin:0 0 14px;color:var(--text-dim)}
.ring{width:120px;height:120px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{stroke:var(--text-soft)}
.ring .rfg{stroke:url(#ringGrad);transition:stroke-dashoffset 1s var(--ease)}
.ring .rtxt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:20px;line-height:1.1}
.ring .rtxt small{display:block;font-size:11px;color:var(--text-dim);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{padding:14px;text-align:left}
.stat .k{font-size:12px;font-weight:700;color:var(--text-dim)}
.stat .v{font-size:24px;font-weight:900;line-height:1.2}
.stat .ic{color:var(--accent);margin-bottom:4px}
.wotd{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.wotd .big{font-size:52px;line-height:1;font-family:var(--font-hz);font-weight:700}
.wotd .py{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);transition:transform .2s var(--ease),box-shadow .25s;min-height:110px}
.tile:hover{transform:translateY(-3px);box-shadow:var(--glow)}
.tile .em{font-size:28px}
.tile b{font-size:16px}
.tile span:not(.em){font-size:13px;color:var(--text-dim)}
@media (max-width:520px){
  .hero{grid-template-columns:1fr}
  .ring{width:104px;height:104px;position:absolute;right:14px;top:14px}
  .hero-text{padding-right:104px}
  .hero-actions .btn{flex:1}
  .tiles{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tile{padding:12px;min-height:96px}
  .tile span:not(.em){display:none}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat .v{font-size:20px}
  .wotd .big{font-size:42px}
}
@media (max-width:360px){ .hero-text{padding-right:0} .ring{position:relative;right:auto;top:auto} }

/* Units grid */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s;border:1px solid var(--border)}
.unit:hover{transform:translateY(-4px);box-shadow:var(--glow)}
.unit .top{display:flex;align-items:center;gap:12px}
.unit .em{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.unit h3{margin:0;font-size:17px}
.unit p{margin:0;font-size:13px;color:var(--text-dim)}
.unit .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);font-weight:700}
.unit.done .em{box-shadow:0 0 0 2px var(--good)}

/* Lesson */
.lesson-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lesson-head h2{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--text-soft);transition:background .3s,transform .3s}
.dots i.on{background:var(--accent);transform:scale(1.25)}
.dots i.seen{background:var(--accent-mid)}
.flash{text-align:center;padding:26px 18px 18px;touch-action:pan-y;animation:cardin .45s var(--ease) both}
@keyframes cardin{from{opacity:0;transform:translateX(var(--dx,30px)) rotate(var(--rot,2deg))}to{opacity:1;transform:none}}
.flash .big{font-size:clamp(54px,15vw,96px);line-height:1.1;font-family:var(--font-hz);font-weight:700;word-break:keep-all}
.flash .py{font-size:clamp(22px,5.5vw,30px);margin-top:6px}
.flash .gloss{font-size:18px;margin-top:8px}
.flash .note{font-size:13px;color:var(--text-dim);margin-top:8px}
.tools{display:flex;gap:10px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.tool{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface-2);transition:transform .15s,box-shadow .2s}
.tool:active{transform:scale(.9)}
.tool.rec{color:var(--bad)}
.tool.rec.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--bad-soft)}}
.example{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);text-align:left;border:1px dashed var(--border)}
.example .hz{font-size:20px}
.example .py{font-size:15px}
.example .tr{font-size:14px;color:var(--text-dim)}
.lesson-actions{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;margin-top:14px}
.intro-card{text-align:left;padding:22px}
.tone-table{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tone-cell{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);text-align:center}
.tone-cell b{display:block;font-size:22px}
.tone-cell svg{width:100%;height:34px}
@media (max-width:420px){.tone-table{grid-template-columns:repeat(2,1fr)}}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1}
.qcard{padding:22px 18px;text-align:center;animation:cardin .4s var(--ease) both}
.qprompt{font-size:14px;font-weight:800;color:var(--text-dim);letter-spacing:.5px}
.qmain{font-size:clamp(40px,11vw,70px);font-family:var(--font-hz);font-weight:700;line-height:1.2;margin:8px 0}
.qmain.pyq{font-family:inherit;font-size:clamp(26px,7vw,40px)}
.qmain.txt{font-family:var(--font);font-size:clamp(22px,6vw,32px)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{min-height:62px;padding:10px 12px;border-radius:16px;border:2px solid var(--border);background:var(--surface-2);font-size:18px;font-weight:700;transition:transform .15s,border-color .2s,background .2s;word-break:break-word}
.opt.hz{font-size:24px}
.opt:hover{border-color:var(--border-strong)}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--good);background:var(--good-soft);animation:yay .5s var(--ease)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes yay{40%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.typebox{display:flex;gap:8px;margin-top:16px}
.typebox input{flex:1;min-width:0;height:54px;border-radius:14px;border:2px solid var(--border);background:var(--surface-2);padding:0 14px;font-size:20px;font-weight:700}
.typebox input:focus{border-color:var(--accent)}
.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.keys button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:800}
.feedback{margin-top:14px;padding:14px;border-radius:16px;text-align:left;animation:pagein .3s var(--ease)}
.feedback.ok{background:var(--good-soft);border:1px solid var(--good-mid)}
.feedback.no{background:var(--bad-soft);border:1px solid var(--bad-mid)}
.feedback .fh{font-weight:900;margin-bottom:4px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;transition:transform .2s var(--ease)}
.pick:hover{transform:translateY(-3px)}
.pick .em{font-size:26px}
.pick b{display:block}
.pick span{font-size:12px;color:var(--text-dim)}
.result{text-align:center;padding:28px 18px}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}
.stars .ic{width:46px;height:46px;color:var(--text-soft);transition:color .3s}
.stars .ic.on{color:var(--warn);fill:var(--warn);animation:starpop .5s var(--ease) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.miss{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left}

/* Stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.scard{padding:0;overflow:hidden;cursor:pointer;text-align:left;transition:transform .25s var(--ease)}
.scard:hover{transform:translateY(-4px)}
.scard .thumb{aspect-ratio:5/3;background:var(--stage-bg);overflow:hidden}
.scard .thumb svg{width:100%;height:100%;display:block}
.scard .info{padding:12px 14px}
.scard h3{margin:0;font-size:17px}
.scard p{margin:2px 0 0;font-size:13px;color:var(--text-dim)}
.player{display:grid;gap:12px}
@media (min-width:900px), (orientation:landscape) and (max-height:560px){
  .player{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .player .ptop{grid-column:1 / -1}
}
.stage{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--stage-bg);border:1px solid var(--border);aspect-ratio:5/3;box-shadow:var(--shadow)}
.stage svg{width:100%;height:100%;display:block}
.dialog{min-height:150px}
.dialog .who{font-weight:900;color:var(--accent);font-size:14px;margin-bottom:4px}
.dialog .hz{font-size:clamp(22px,5.4vw,30px);line-height:1.35}
.dialog .py{font-size:16px;margin-top:4px}
.dialog .tr{color:var(--text-dim);margin-top:6px}
.dialog .line{animation:pagein .35s var(--ease)}
.pcontrols{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pcontrols .tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.actor-inner{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite}
.actor.speaking .actor-inner{animation:talkbob .55s ease-in-out infinite}
.actor .mouth{transform-box:fill-box;transform-origin:center}
.actor.speaking .mouth{animation:mouth .2s ease-in-out infinite alternate}
.actor.dim{opacity:.72}
.actor.enter .actor-inner{animation:enter .6s var(--ease) both, idle 2.6s .6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-3px)}}
@keyframes talkbob{50%{transform:translateY(-6px) scale(1.03)}}
@keyframes mouth{to{transform:scaleY(2.4)}}
@keyframes enter{from{transform:translateY(40px);opacity:0}}
.rain line{animation:fall .9s linear infinite}
@keyframes fall{from{transform:translateY(-60px)}to{transform:translateY(260px)}}
.chick{transform-box:fill-box;transform-origin:50% 100%}
.counting .chick{animation:hop .45s ease-in-out both;animation-delay:calc(var(--i) * .32s)}
@keyframes hop{50%{transform:translateY(-14px)}}
.cloud{animation:cloud 18s linear infinite alternate}
@keyframes cloud{to{transform:translateX(40px)}}
.sunr{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lvl{display:flex;align-items:center;gap:16px}
.lvl .num{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:8px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .col i{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--accent),var(--accent-2));min-height:4px;transition:height .8s var(--ease)}
.week .col span{font-size:11px;color:var(--text-dim);font-weight:700}
.week .col em{font-style:normal;font-size:11px;font-weight:800}
.ulist{display:grid;gap:12px}
.urow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bdg{text-align:center;padding:14px 8px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border)}
.bdg .em{font-size:32px;filter:grayscale(1);opacity:.4}
.bdg.on .em{filter:none;opacity:1;animation:starpop .6s var(--ease)}
.bdg b{display:block;font-size:13px;margin-top:4px}
.bdg span{font-size:11px;color:var(--text-dim)}

/* Settings */
.set-sec{margin-bottom:14px}
.set-sec h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{font-weight:700}
.set-row .lbl small{display:block;font-weight:500;color:var(--text-dim);font-size:12px}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 12px;border-radius:10px;border:0;background:transparent;font-weight:800;font-size:14px;color:var(--text-dim);transition:background .25s,color .25s}
.seg button[aria-checked="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.switch{width:54px;height:32px;border-radius:99px;border:1px solid var(--border);background:var(--text-soft);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(180px,40vw);height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:var(--text-soft)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--text-soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-9px;width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--surface-solid);box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--surface-solid)}
select{max-width:min(230px,52vw);height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);padding:0 10px}
.asst-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.asst-opt{padding:12px 8px;border-radius:16px;border:2px solid var(--border);background:var(--surface-2);text-align:center;transition:border-color .2s,transform .2s}
.asst-opt[aria-checked="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.asst-opt .em{font-size:34px;display:block}
.asst-opt b{display:block;font-size:15px}
.asst-opt span{font-size:11px;color:var(--text-dim)}
.theme-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-opt{border-radius:16px;border:2px solid var(--border);padding:8px;background:var(--surface-2);font-weight:800;font-size:13px}
.theme-opt[aria-checked="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.theme-opt i{display:block;height:44px;border-radius:10px;margin-bottom:6px}
@media (max-width:420px){.theme-pick{grid-template-columns:repeat(2,1fr)}.set-row{flex-wrap:wrap}}
.src-list li{margin-bottom:6px}

/* ============ MODAL / TOUR / TOAST ============ */
#modalRoot .backdrop{position:fixed;inset:0;z-index:20;background:rgba(3,6,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:24px;padding:22px;box-shadow:var(--shadow),var(--glow);animation:modalin .4s var(--ease) both;-webkit-overflow-scrolling:touch}
@keyframes modalin{from{opacity:0;transform:translateY(24px) scale(.96)}}
.modal h2{margin:0 0 8px;font-size:22px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .actions .btn{flex:1 1 140px}
.modal ul{padding-left:20px;margin:8px 0}
#tour{position:fixed;inset:0;z-index:30;display:none}
#tour.on{display:block}
#tour .shade{position:fixed;inset:0;background:transparent}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(3,6,18,.66),0 0 0 3px var(--accent),0 0 28px var(--accent);transition:all .45s var(--ease);pointer-events:none}
#tour .tip{position:fixed;width:min(330px,calc(100vw - 24px));background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:20px;padding:16px;box-shadow:var(--shadow);transition:top .45s var(--ease),left .45s var(--ease);animation:modalin .35s var(--ease)}
#tour .tip h3{margin:0 0 6px;font-size:17px}
#tour .tip p{margin:0;color:var(--text-dim);font-size:14.5px}
#tour .tip .tnav{display:flex;align-items:center;gap:8px;margin-top:14px}
#tour .tip .tnav .cnt{flex:1;font-size:12px;font-weight:800;color:var(--text-dim)}
#toasts{position:fixed;z-index:40;left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);display:grid;gap:8px;width:min(420px,calc(100vw - 24px));pointer-events:none}
.toast{padding:12px 16px;border-radius:16px;background:var(--surface-solid);border:1px solid var(--border-strong);box-shadow:var(--shadow);font-weight:700;display:flex;gap:10px;align-items:center;animation:toastin .4s var(--ease) both}
.toast.out{animation:toastout .3s ease both}
@keyframes toastin{from{opacity:0;transform:translateY(-16px)}}
@keyframes toastout{to{opacity:0;transform:translateY(-12px)}}
#confetti{position:fixed;inset:0;z-index:35;pointer-events:none;width:100%;height:100%}


/* ===== extras ===== */
.lesson-head h2 .ic{display:inline-block;vertical-align:-4px}
.tips{margin-top:14px;text-align:left;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);padding:10px 14px}
.tips summary{font-weight:800;cursor:pointer;color:var(--accent);list-style-position:inside}
.tips ul{margin:8px 0 0;padding-left:18px}.tips li{margin:5px 0;font-size:14px;line-height:1.5}
.vs{margin-top:10px;text-align:left;padding:10px 14px;border-radius:14px;border:1px solid var(--accent-mid);background:var(--accent-soft);font-size:14px}
.vs b{color:var(--accent)}
.gram ul,.glist{padding-left:20px;margin:8px 0 0}.gram li,.glist li{margin:10px 0}
.gtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.gtable th,.gtable td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.gtable th{font-size:12px;color:var(--text-dim)}.gtable td.l{font-weight:900;font-size:18px;color:var(--accent)}.gtable td.hz{font-size:18px}
.chipbtn{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font:inherit;font-size:14px;cursor:pointer;margin:3px 4px 3px 0;color:inherit}
.chipbtn .py{font-size:13px}
.tool.hk,.btn.hk{color:var(--accent-3)}.tool.hk.off,.btn.hk.off{opacity:.42}
.pcontrols .tool{width:48px;height:48px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.srow .sw{min-width:0}.srow .hz{font-size:20px}.srow .tool{width:46px;height:46px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media (max-width:480px){.sgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.field input{height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);padding:0 12px;font-size:16px}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:700;min-height:44px}
.check input{width:30px;height:30px;flex:none;accent-color:var(--accent)}
.warn{color:var(--warn)}

.news{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px 16px;text-align:left;cursor:pointer;transition:transform .2s var(--ease)}
.news:hover{transform:translateY(-2px)}
.news .em{font-size:24px}
button.card,button.tile,button.tone-cell{font:inherit;color:inherit;width:100%;text-align:left}
button.tone-cell{text-align:center;cursor:pointer}
.static *{animation:none!important}
.stars span{display:inline-block}
.xp-pop{position:fixed;z-index:41;top:calc(86px + var(--sat));right:calc(110px + var(--sar));font-weight:900;color:var(--accent);background:var(--surface-solid);border:1px solid var(--border-strong);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);animation:xpup 1.2s var(--ease) forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@media (max-width:420px){.wotd{gap:12px}.wotd .wbtns{flex-direction:column;gap:8px}.wotd .tool{width:46px;height:46px}}
.pick[disabled]{cursor:default}
.lesson-actions .btn{padding:0 12px}
.opt .py{font-size:20px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

const DEFAULTS = {
  settings:{ lang:'zh', assistant:'dragon', theme:'dark', mute:false, music:true, musicVol:.5, musicStyle:'lively',
    sfx:true, sfxVol:.7, voice:true, voiceVol:1, voiceName:'', script:'s', toneMode:'num', toneColor:true,

};
let S, storageOk = true;
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function mergeInto(base, src){
  if (!isObj(src)) return base;
  for (const k of Object.keys(src)){
    const b = base[k], v = src[k];
    if (isObj(b) && isObj(v)) mergeInto(b, v);
    else if (b === undefined || typeof b === typeof v) base[k] = v;
  }
  return base;
}
function loadStore(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); localStorage.setItem(STORE_KEY + '.t', '1'); localStorage.removeItem(STORE_KEY + '.t'); }
  catch (e){ storageOk = false; }
  let parsed = null; try { parsed = raw ? JSON.parse(raw) : null; } catch (e){ parsed = null; }
  S = mergeInto(JSON.parse(JSON.stringify(DEFAULTS)), parsed || {});
  if (!ASSTS[S.settings.assistant]) S.settings.assistant = 'dragon';
  if (!['dark','light','glass','dreamy'].includes(S.settings.theme)) S.settings.theme = 'dark';
  if (!['zh','en'].includes(S.settings.lang)) S.settings.lang = 'zh';
}
let saveTimer = 0;
function save(now){
  clearTimeout(saveTimer);
  const doIt = () => { if (!storageOk) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e){ storageOk = false; } };
  if (now) doIt(); else saveTimer = setTimeout(doIt, 250);
}
window.addEventListener('pagehide', () => save(true));
const L = () => S.settings.lang;
function t(key, vars){
  let s = (T[L()] && T[L()][key] !== undefined) ? T[L()][key] : (T.zh[key] !== undefined ? T.zh[key] : key);
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
  return s;
}
const asstName = () => ASSTS[S.settings.assistant].name[L()];

/* ---------- Content helpers ---------- */
const ALL_WORDS = [];
const WORD_UNIT = {}, WORD_BY_ID = {};
UNITS.forEach(u => u.words.forEach(w => { ALL_WORDS.push(w); WORD_UNIT[w.id] = u.id; WORD_BY_ID[w.id] = w; }));
const unitWords = u => u.words.concat((u.refs || []).map(id => WORD_BY_ID[id]).filter(Boolean));
const unitById = id => UNITS.find(u => u.id === id);
const storyById = id => STORIES.find(s => s.id === id);
const hz = o => (S.settings.script === 't' && o.t) ? o.t : o.s;
const gl = o => o[L()] || o.zh;
const ws = id => S.words[id] || (S.words[id] = {box:0, seen:0, ok:0, bad:0, last:''});
const isNewItem = o => !!(o.since && S.prevVersion && cmpVer(o.since, S.prevVersion) > 0);

/* ---------- Pinyin ---------- */
const SYL_RE = /([a-zêA-ZÊ]+)([1-6])/g;
const CONTOUR = {1:'˦',2:'˩',3:'˧˩',4:'˥˨',5:'˩',6:'˥'};
function pyHTML(py){
  let out = '', last = 0, m;
  SYL_RE.lastIndex = 0;
  while ((m = SYL_RE.exec(py))){

function toast(msg, em = 'ℹ️', ms = 2600){
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span aria-hidden="true">${em}</span><span>${esc(msg)}</span>`;

}

    const p = (now - start) / 1700; ctx.clearRect(0, 0, innerWidth, innerHeight);

const Modal = {
  stack:[],
  open(html, {persistent = false, onClose = null} = {}){
    const bd = document.createElement('div'); bd.className = 'backdrop';
    bd.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    $('#modalRoot').appendChild(bd);
    const m = {bd, persistent, onClose}; this.stack.push(m);
    bd.addEventListener('click', e => { if (e.target === bd && !persistent) this.close(); });
    setTimeout(() => { const f = bd.querySelector('[autofocus]') || bd.querySelector('button'); if (f) f.focus({preventScroll:true}); }, 60);
    return bd.firstElementChild;
  },
  close(){ const m = this.stack.pop(); if (!m) return; m.bd.remove(); if (m.onClose) m.onClose(); },
  closeAll(){ while (this.stack.length) this.close(); }

/* ---------- Settings mutation ---------- */
function setSetting(k, v){
  const s = S.settings; if (s[k] === v) return; s[k] = v; save();
  switch (k){
    case 'lang': applyI18n(true); return;
    case 'assistant': Asst.set(v); break;
    case 'theme': case 'toneColor': applyTheme(); break;
    case 'mute': Sound.apply(); if (v) Voice.stop(); updateChrome(); break;
    case 'music': case 'sfx': Sound.apply(); break;
    case 'musicStyle': Sound.restartMusic(); break;
    case 'voice': if (!v) Voice.stop(); break;
    case 'chatty': Asst.schedule(); break;
  }
  if (current.name === 'settings') renderSettings(true);
  else if (['script','toneMode','toneColor','theme'].includes(k)) renderCurrent(true);
}

const Rec = {
  mr:null, chunks:[], url:null, timer:0, btn:null, playBtn:null,
  async toggle(btn, playBtn){
    if (this.mr && this.mr.state === 'recording'){ this.stop(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast(t('micDenied'), '⚠️'); return; }
    this.btn = btn; this.playBtn = playBtn;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      if (!this.btn || !this.btn.isConnected){ stream.getTracks().forEach(tr => tr.stop()); return; }
      this.chunks = []; const mr = new MediaRecorder(stream); this.mr = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop()); Sound.duck(false);
        if (this.url) URL.revokeObjectURL(this.url);
        this.url = this.chunks.length ? URL.createObjectURL(new Blob(this.chunks, {type:mr.mimeType || 'audio/mp4'})) : null;
        if (this.btn){ this.btn.classList.remove('on'); this.btn.setAttribute('aria-label', t('record')); }
        if (this.playBtn && this.playBtn.isConnected && this.url) this.playBtn.hidden = false;
        S.misc.rec = (S.misc.rec || 0) + 1; checkBadges(); save(); this.mr = null;
      };
      Sound.duck(true); mr.start(); btn.classList.add('on'); btn.setAttribute('aria-label', t('stopRec'));
      toast(t('recording'), '🎙️', 2000); this.timer = setTimeout(() => this.stop(), 4000);
    } catch (e){ toast(t('micDenied'), '⚠️'); }
  },
  stop(){ clearTimeout(this.timer); if (this.mr && this.mr.state === 'recording') this.mr.stop(); },
  play(){ if (!this.url) return; const a = new Audio(this.url); a.play().catch(() => {}); },
  reset(){ this.stop(); this.btn = null; this.playBtn = null; if (this.url){ URL.revokeObjectURL(this.url); this.url = null; } }
};

const SYN = [['g3','g4'],['n2','n12'],['c4','c5']];
const synOf = id => { const g = SYN.find(a => a.includes(id)); return g ? g : [id]; };

function allowedTypes(w, kind){
  const n = sylls(w.py).length, a = ['h2p','m2h'];
  if (PY_COUNT[normPy(w.py)] === 1) a.push('p2m');
  if (n <= 3) a.push('type');
  if (n === 1) a.push('tone');
  if (kind === 'tones' && !S.settings.mute) a.push('hear', 'hear');
  if (kind === 'sounds') return a.filter(x => ['h2p','type','tone'].includes(x));

}
function distractors(w, key, count = 3){
  const avoid = new Set(synOf(w.id)), pick = [], seenKey = new Set([key(w)]);

}
function makeQ(w, type){

    const n = sylls(w.py).length; const opts = [w.py];
    if (n === 1){ const s = sylls(w.py)[0]; const alt = shuffle([1,2,3,4,5,6].filter(x => x !== s.tone && ((s.tone >= 5) === (x >= 5) || /[bdg]$/.test(s.seg) === (x >= 5))))[0]; if (alt) opts.push(s.seg + alt); }
    const same = shuffle(ALL_WORDS.filter(x => x.id !== w.id && sylls(x.py).length === n && !opts.map(normPy).includes(normPy(x.py))));
    for (const x of same.concat(distractors(w, x => normPy(x.py), 6))){ if (opts.length >= 4) break; if (!opts.map(normPy).includes(normPy(x.py))) opts.push(x.py); }

  } else if (type === 'p2m'){
    q.opts = shuffle([w].concat(distractors(w, x => gl(x)))).map(x => x.id); q.ans = w.id;
  } else if (type === 'm2h'){
    q.opts = shuffle([w].concat(distractors(w, x => hz(x)))).map(x => x.id); q.ans = w.id;
  } else if (type === 'tone' || type === 'hear'){
    const tone = sylls(w.py)[0].tone; q.opts = shuffle([tone].concat(shuffle([1,2,3,4,5,6].filter(x => x !== tone)).slice(0, 3))); q.ans = tone;
  } else if (type === 'type'){ q.ans = w.py; }
  return q;
}
function buildQuiz(kind){
  let pool;
  if (kind === 'mixed'){ pool = ALL_WORDS.filter(w => S.words[w.id] && S.words[w.id].seen); if (pool.length < 6) pool = ALL_WORDS.filter(w => WORD_UNIT[w.id] !== 'tones'); }
  else if (kind === 'weak'){ pool = weakWords(); if (!pool.length) return null; }

const castFor = (st, scene) => (st.sceneCast && st.sceneCast[scene]) || st.cast;
function drawScene(scene, cast, opts = {}){
  const slots = cast.length === 1 ? [200] : cast.length === 2 ? (scene === 'farm' ? [70, 140] : [130, 270]) : [90, 200, 310];
  const actors = cast.map((who, k) => `<g transform="translate(${slots[k]} 226)"><g class="actor ${opts.enter ? 'enter' : ''}" data-who="${who}"><g class="actor-inner">${ART[who]()}</g></g></g>`).join('');
  return `<svg viewBox="0 0 400 240" class="${opts.static ? 'static' : ''}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SCENES[scene]()}${actors}</svg>`;
}
function renderStories(){

}
function renderStory(id){
  const st = storyById(id); if (!st){ go('#stories'); return; }
  let i = 0, auto = false, showPy = S.settings.storyPinyin, scene = null, tok = 0, phase = 'watch';
  view.innerHTML = `<section class="page"><div class="player">
    <div class="ptop lesson-head"><button class="icon-btn" data-go="#stories" aria-label="${esc(t('back'))}">${icon('back')}</button><h2>${esc(gl(st.title))}</h2><span class="chip" id="spStep"></span></div>
    <div class="stage" id="stage"></div>
    <div id="spRight"><div class="card dialog" id="dlg"></div>
      <div class="pcontrols" id="pctl">
        <button class="tool" id="spPrev" aria-label="${esc(t('prev'))}">${icon('prev')}</button>
        <button class="tool hk" id="spHk" aria-label="${esc(t('hearHakka'))}" title="${esc(t('hearHakka'))}">${icon('hakka')}</button>
        <button class="tool" id="spRe" aria-label="${esc(t('replay'))}" title="${esc(t('replay'))}">${icon('speak')}</button>
        <button class="tool" id="spPlay" aria-pressed="false" aria-label="${esc(t('play'))}" title="${esc(t('play'))}">${icon('play')}</button>
        <button class="tool" id="spPy" aria-pressed="${showPy}" aria-label="${esc(t('pinyin'))}" title="${esc(t('pinyin'))}"><b style="font-size:13px">${L() === 'zh' ? '拼' : 'Py'}</b></button>
        <button class="tool" id="spNext" aria-label="${esc(t('next'))}">${icon('next')}</button>
      </div></div></div></section>`;
  const stage = $('#stage'), dlg = $('#dlg');
  const sceneAt = k => { let sc = st.scene; for (let j = 0; j <= k; j++) if (st.lines[j].scene) sc = st.lines[j].scene; return sc; };
  function setAuto(on){ auto = on; const b = $('#spPlay'); if (!b) return; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.innerHTML = icon(on ? 'pause' : 'play'); b.setAttribute('aria-label', on ? t('pause') : t('play')); b.title = on ? t('pause') : t('play'); }
  function show(k, speak){
    i = k; const ln = st.lines[i], sc = sceneAt(i);
    if (sc !== scene){ scene = sc; stage.innerHTML = drawScene(sc, castFor(st, sc), {enter:true}); }
    const svg = stage.querySelector('svg'); svg.classList.toggle('counting', ln.act === 'count');
    if (ln.act === 'count'){ svg.classList.remove('counting'); void svg.getBoundingClientRect(); svg.classList.add('counting'); }
    $$('.actor', stage).forEach(a => { const sp = a.dataset.who === ln.who; a.classList.toggle('speaking', sp); a.classList.toggle('dim', ln.who !== 'narr' && !sp); });
    dlg.innerHTML = `<div class="line"><div class="who">${esc(gl(CAST[ln.who] || CAST.narr))}</div><div class="hz">${esc(hz(ln))}</div>${showPy ? `<div>${pyHTML(ln.py)}</div>` : ''}<div class="tr">${esc(gl(ln))}</div></div>`;
    $('#spStep').textContent = t('lineOf', {i:i + 1, n:st.lines.length});
    $('#spPrev').disabled = i === 0;
    $('#spHk').classList.toggle('off', !VoicePack.has(clipId()));
    if (speak) speakLine();
  }
  const clipId = () => st.id + '.' + (i + 1);
  async function speakLine(){
    const my = ++tok, ln = st.lines[i];
    if (VoicePack.has(clipId()) && !S.settings.mute){ await VoicePack.play(clipId()); if (my !== tok || phase !== 'watch') return; await new Promise(r => setTimeout(r, 250)); if (my !== tok) return; }
    Voice.speak(gl(ln), {silentWait:auto, onend:() => {
      if (my !== tok || phase !== 'watch') return;
      $$('.actor', stage).forEach(a => a.classList.remove('speaking'));
      if (auto) setTimeout(() => { if (my !== tok || phase !== 'watch') return; if (i < st.lines.length - 1) show(i + 1, true); else { setAuto(false); quiz(); } }, 650);
    }});
  }
  function next(){ tok++; Voice.stop(); VoicePack.stop(); if (i < st.lines.length - 1){ Sound.play('flip'); show(i + 1, true); } else quiz(); }
  function prev(){ if (i > 0){ tok++; Voice.stop(); VoicePack.stop(); Sound.play('flip'); show(i - 1, true); } }
  $('#spNext').addEventListener('click', () => { setAuto(false); next(); });
  $('#spPrev').addEventListener('click', () => { setAuto(false); prev(); });
  $('#spHk').addEventListener('click', () => { tok++; Voice.stop(); playHakka(clipId()); });
  $('#spRe').addEventListener('click', () => { unlock(); if (!Voice.ok || !S.settings.voice || S.settings.mute) sayText(gl(st.lines[i])); else speakLine(); });
  $('#spPlay').addEventListener('click', () => { unlock(); if (auto){ setAuto(false); tok++; Voice.stop(); } else { setAuto(true); speakLine(); } });
  $('#spPy').addEventListener('click', e => { showPy = !showPy; e.currentTarget.setAttribute('aria-pressed', showPy); show(i, false); });
  let sx = null; stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60){ setAuto(false); dx < 0 ? next() : prev(); } }, {passive:true});
  function quiz(){
    phase = 'quiz'; tok++; Voice.stop(); setAuto(false);
    $$('.actor', stage).forEach(a => { a.classList.remove('speaking', 'dim'); });
    $('#pctl').style.display = 'none';
    let qi = 0, correct = 0;
    const drawQ = () => {
      const q = st.quiz[qi], order = shuffle(q.opts.map((o, k) => k));
      $('#spStep').textContent = `${t('storyQuiz')} ${qi + 1}/${st.quiz.length}`;
      dlg.innerHTML = `<div class="line"><div class="who">${esc(t('storyQuiz'))}</div><div style="font-weight:800;font-size:18px;margin-bottom:10px">${esc(gl(q.q))}</div>
        <div class="opts" style="grid-template-columns:1fr">${order.map(k => `<button class="opt" data-k="${k}" style="text-align:left"><span class="hz">${esc(hz(q.opts[k]))}</span> <span class="small muted">· ${esc(gl(q.opts[k]))}</span></button>`).join('')}</div><div id="sfb"></div></div>`;
      $$('.opt', dlg).forEach(b => b.addEventListener('click', () => {
        const ok = +b.dataset.k === q.a;
        $$('.opt', dlg).forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('correct'); });
        if (!ok) b.classList.add('wrong');
        if (ok){ correct++; Sound.play('good'); A3D.react('happy'); } else { Sound.play('bad'); A3D.react('sad'); }
        const last = qi === st.quiz.length - 1;
        $('#sfb').innerHTML = `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="sqN">${esc(last ? t('finish') : t('next'))}${icon('next')}</button></div>`;
        $('#sqN').addEventListener('click', () => { if (last) end(); else { qi++; drawQ(); } });
        setTimeout(() => $('#sqN').focus({preventScroll:true}), 60);
      }));
    };
    const end = () => {
      const rec = S.stories[st.id] || {}, first = !rec.done;
      S.stories[st.id] = {done:true, best:Math.max(rec.best || 0, correct)};
      const xp = correct * 5 + (first ? 15 : 0); addXP(xp); checkBadges(); save();
      if (correct === st.quiz.length){ confetti(); Sound.play('fanfare'); }
      $('#spStep').textContent = '✓';
      dlg.innerHTML = `<div class="line center"><div style="font-size:46px">🎬</div><h3 style="margin:4px 0">${esc(t('storyDone'))}</h3><p class="muted">${esc(t('score'))} ${correct}/${st.quiz.length} · ${esc(t('xpGain', {n:xp}))}</p>
        <div class="row" style="justify-content:center"><button class="btn" data-go="#stories">${icon('back')}${esc(t('back'))}</button><button class="btn primary" id="sRe">${icon('refresh')}${esc(t('replay'))}</button></div></div>`;
      $('#sRe').addEventListener('click', () => renderStory(st.id));
      Asst.say(rnd(LINES[L()].done), {mood:'happy'});
    };
    drawQ();
  }
  viewKeys = e => { if (phase !== 'watch') return; if (e.key === 'ArrowRight'){ setAuto(false); next(); } else if (e.key === 'ArrowLeft'){ setAuto(false); prev(); } else if (e.key === ' '){ e.preventDefault(); $('#spPlay').click(); } };
  viewCleanup = () => { tok++; phase = 'gone'; VoicePack.stop(); };
  show(0, false);
}

  async function onList(e){
    const r = e.target.closest('[data-rec]'), pl = e.target.closest('[data-play]'), dl = e.target.closest('[data-del]');
    if (r) return toggleRec(r.dataset.rec, r);
    if (pl){ unlock(); const ok = await VoicePack.play(pl.dataset.play); if (!ok) toast(t('playFail'), '⚠️'); return; }
    if (dl){
      const id = dl.dataset.del;
      const m = Modal.open(`<h2>${esc(t('delClip'))}</h2><div class="actions"><button class="btn" id="dNo" autofocus>${esc(t('cancel'))}</button><button class="btn danger" id="dYes">${icon('trash')}${esc(t('del'))}</button></div>`);

  async function toggleRec(id, btn){
    unlock();
    if (rec && rec.state === 'recording'){ stopRec(); return; }
    try {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
      if (current.name !== 'studio'){ stream.getTracks().forEach(tr => tr.stop()); stream = null; return; }
      const chunks = []; const mr = new MediaRecorder(stream); rec = mr; recId = id; const t0 = performance.now();
      mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onstop = async () => {
        Sound.duck(false); btn.classList.remove('on'); const dur = (performance.now() - t0) / 1000;
        if (chunks.length && dur > .25){ const blob = new Blob(chunks, {type:mr.mimeType || chunks[0].type || 'audio/mp4'}); try { await VoicePack.put(id, blob, Math.round(dur * 10) / 10); S.misc.rec = (S.misc.rec || 0) + 1; checkBadges(); save(); Sound.play('good'); } catch (err){ toast(t('noIdb'), '⚠️'); } }
        rec = null; recId = null; refreshRow(id);

    } catch (err){ toast(t('noIdb'), '⚠️'); }
  }
  viewCleanup = () => { stopRec(); if (stream){ stream.getTracks().forEach(tr => tr.stop()); stream = null; } };
  draw();
}

  <p class="small muted">版本 ${APP_VERSION} · 3D 由内置的 Three.js r128（MIT 许可）渲染 · 角色、场景、图标与音乐均为本应用原创、由程序生成。</p>`,
 en:`<p>Hakka Joy teaches <b>Meixian Hakka</b>. Spelling follows the Hakka Pinyin Scheme (客家话拼音方案) published by Guangdong's education authority in 1960 (Meixian): tones are digits 1–6, ê is [ɛ], e is [ə], and checked syllables end in b, d or g.</p>
  <h3>Sources</h3><ul class="src-list">
   <li>Scheme, tones and example set: Wikipedia, "Pinfa", which cites Ouyang Jue et al., <i>A Comparative Dictionary of Cantonese, Hakka, Chaoshan and Mandarin</i> (Guangdong People's Publishing House, 2005).</li>
   <li>Word readings: the "Guangdong Romanization (Meixian)" field of English Wiktionary character entries, retrieved 2026-10-17.</li>
   <li>DeepSeek cross-check: __DK_EN__</li></ul>
  <h3>Source labels</h3><ul class="src-list"><li><span class="badge src-P">Scheme example</span> taken from the scheme itself</li><li><span class="badge src-W">Dictionary-checked</span> Wiktionary lists this word's Meixian spelling</li><li><span class="badge src-C">Composed</span> no entry for the word; built from single-character readings</li><li><span class="badge src-I">Inferred</span> no Meixian spelling given; inferred from tone correspondence</li><li><span class="badge src-S">Composed sentence</span> built from checked words; grammar not dictionary-attested</li></ul>
  <h3>Limitations</h3><ul class="src-list"><li>There are no native-speaker recordings. Browser voices read only the Mandarin or English meaning; the tone hum is a contour sketch, not a pronunciation.</li><li>Treat "Inferred", "Composed" and "Composed sentence" items as provisional until a native speaker confirms them.</li><li>Only citation tones are shown; tone sandhi is not marked.</li><li>Wiktionary is community-edited, not a peer-reviewed dictionary.</li><li>Extension characters such as 𠊎 may show as a box on some devices.</li><li>Pronunciation tips, grammar tips, Hakka-vs-Mandarin notes and the Pronunciation Guide were written for this app from the sources above; they are not quoted entry by entry from a dictionary. Defer to native speakers.</li><li>Native recordings are made in the Recording Studio; built-in recordings will be added in later versions with the speaker credited.</li></ul>
  <p class="small muted">Version ${APP_VERSION} · 3D rendered with built-in Three.js r128 (MIT licence) · characters, scenes, icons and music are original to this app and generated in code.</p>`
};
function about(){ const m = Modal.open(`<h2>${esc(t('aboutTitle'))}</h2>${ABOUT[L()]}<div class="actions"><button class="btn primary" id="abOk" autofocus>${esc(t('close'))}</button></div>`); m.querySelector('#abOk').addEventListener('click', () => Modal.close()); }
let updateShown = false;
async function checkUpdate(manual){
  if (location.protocol === 'file:' || !window.fetch){ if (manual) toast(t('updateFail'), '⚠️'); return; }
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'}); if (!r.ok) throw new Error('http');
    const txt = await r.text(); const m = txt.match(/const APP_VERSION = '(\d+\.\d+\.\d+)'/);
    if (m && cmpVer(m[1], APP_VERSION) > 0){
      if (updateShown && !manual) return; updateShown = true;
      const md = Modal.open(`<h2>🚀 ${esc(t('updateAvail', {v:m[1]}))}</h2><div class="actions"><button class="btn" id="uLater">${esc(t('cancel'))}</button><button class="btn primary" id="uNow" autofocus>${icon('refresh')}${esc(t('refresh'))}</button></div>`);
      md.querySelector('#uLater').addEventListener('click', () => Modal.close());
      md.querySelector('#uNow').addEventListener('click', () => { save(true); location.reload(); });
    } else if (manual) toast(t('upToDate'), '✅');
  } catch (e){ if (manual) toast(t('updateFail'), '⚠️'); }
}

/* ---------- Guided tour ---------- */
const Tour = {
  on:false, i:0, steps:null, el:null,
  start(){
    Modal.closeAll(); unlock();
    if (current.name !== 'home') go('#home');
    this.on = true; this.i = 0; this.steps = TOUR[L()];
    const root = $('#tour'); root.classList.add('on');
    root.innerHTML = `<div class="shade"></div><div class="spot"></div><div class="tip" role="dialog" aria-modal="true"></div>`;
    setTimeout(() => this.show(true), 250);
  },
  target(key){ return $$(`[data-tour="${key}"]`).find(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; }) || null; },
  show(speak){
    if (!this.on) return;
    const st = this.steps[this.i], n = this.steps.length, tip = $('#tour .tip');
    const h = st.h.replace('{name}', asstName());
    tip.innerHTML = `<h3>${esc(h)}</h3><p>${esc(st.p)}</p><div class="tnav"><span class="cnt">${this.i + 1} / ${n}</span>
      ${this.i < n - 1 ? `<button class="btn sm ghost" id="tSkip">${esc(t('skip'))}</button>` : ''}
      ${this.i > 0 ? `<button class="btn sm" id="tBack">${esc(t('tourBack'))}</button>` : ''}
      <button class="btn sm primary" id="tNext">${esc(this.i < n - 1 ? t('tourNext') : t('tourDone'))}</button></div>`;
    tip.querySelector('#tNext').addEventListener('click', () => this.next());
    const bk = tip.querySelector('#tBack'); if (bk) bk.addEventListener('click', () => this.back());
    const sk = tip.querySelector('#tSkip'); if (sk) sk.addEventListener('click', () => this.end());
    setTimeout(() => tip.querySelector('#tNext').focus({preventScroll:true}), 50);
    const el = st.t ? this.target(st.t) : null; this.el = el;
    if (el && el.closest('#view')){ el.scrollIntoView({block:'center', behavior:REDUCED.matches ? 'auto' : 'smooth'}); setTimeout(() => this.place(), 380); }
    else this.place();
    if (speak){ A3D.react(st.t === 'assistant' ? 'happy' : 'wave'); Voice.speak(h + (L() === 'zh' ? '。' : '. ') + st.p); }
  },
  place(){
    if (!this.on) return;
    const tip = $('#tour .tip'), spot = $('#tour .spot'), el = this.el, vw = innerWidth, vh = innerHeight, m = 12;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (!el){ spot.style.cssText = `left:${vw / 2}px;top:${vh / 2}px;width:0;height:0`; tip.style.left = Math.max(m, (vw - tw) / 2) + 'px'; tip.style.top = Math.max(m, (vh - th) / 2) + 'px'; return; }
    const r = el.getBoundingClientRect(), p = 6;
    spot.style.cssText = `left:${r.left - p}px;top:${r.top - p}px;width:${r.width + p * 2}px;height:${r.height + p * 2}px`;
    const cx = r.left + r.width / 2 - tw / 2, cy = r.top + r.height / 2 - th / 2;
    const cands = [{x:cx, y:r.bottom + p + 12, v:1}, {x:cx, y:r.top - p - 12 - th, v:1}, {x:r.right + p + 12, y:cy, v:0}, {x:r.left - p - 12 - tw, y:cy, v:0}];
    const fit = c => c.v ? (c.y >= m && c.y + th <= vh - m) : (c.x >= m && c.x + tw <= vw - m);
    const c = cands.find(fit) || {x:(vw - tw) / 2, y:vh - th - m};
    tip.style.left = clamp(c.x, m, Math.max(m, vw - tw - m)) + 'px';
    tip.style.top = clamp(c.y, m, Math.max(m, vh - th - m)) + 'px';
  },
  next(){ Sound.play('tap'); if (this.i < this.steps.length - 1){ this.i++; this.show(true); } else this.end(true); },
  back(){ Sound.play('tap'); if (this.i > 0){ this.i--; this.show(true); } },
  end(done){
    this.on = false; const root = $('#tour'); root.classList.remove('on'); root.innerHTML = ''; this.el = null;
    if (!done) Voice.stop();
    finishOnboarding(); if (done){ Sound.play('fanfare'); A3D.react('happy'); }
  }
};
window.addEventListener('resize', () => { if (Tour.on) Tour.place(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if (Tour.on) Tour.place(); A3D.resize(); }, 350));
view.addEventListener('scroll', () => { if (Tour.on) Tour.place(); }, {passive:true});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (Tour.on){ Tour.end(); return; }
    const top = Modal.stack[Modal.stack.length - 1]; if (top && !top.persistent){ Modal.close(); return; }
    Asst.hide(); return;
  }
  if (Tour.on){ if (e.key === 'ArrowRight') Tour.next(); else if (e.key === 'ArrowLeft') Tour.back(); return; }
  if (Modal.stack.length) return;
  const tag = (e.target && e.target.tagName) || ''; if (/INPUT|TEXTAREA|SELECT/.test(tag) && e.key !== 'Enter') return;
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (viewKeys) viewKeys(e);
});

/* ---------- Boot ---------- */
function normalizeState(){
  if (!isObj(S.misc)) S.misc = {rec:0, humNoted:0};
  if (typeof S.prevVersion !== 'string') S.prevVersion = '';
  S.settings.dailyGoal = [10,20,30,50].includes(S.settings.dailyGoal) ? S.settings.dailyGoal : 30;
}
function loadThree(){
  return new Promise(res => {
    if (window.THREE) return res(true);
    const srcs = ['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js'];
    let k = 0;
    const next = () => {
      if (k >= srcs.length) return res(false);
      const s = document.createElement('script'); s.src = srcs[k++]; s.async = true; s.crossOrigin = 'anonymous';
      let done = false; const to = setTimeout(() => { if (done) return; done = true; s.remove(); next(); }, 9000);
      s.onload = () => { if (done) return; done = true; clearTimeout(to); res(!!window.THREE); };
      s.onerror = () => { if (done) return; done = true; clearTimeout(to); s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
function boot(){
  loadStore(); normalizeState();
  if (S.tutorialDone && S.lastSeenVersion && cmpVer(APP_VERSION, S.lastSeenVersion) > 0){ S.prevVersion = S.lastSeenVersion; S.lastSeenVersion = APP_VERSION; save(); setTimeout(() => whatsNew(S.prevVersion), 700); }
  applyTheme(); buildNav(); Asst.init(); applyI18n(false);
  $('#muteBtn').addEventListener('click', () => { unlock(); setSetting('mute', !S.settings.mute); if (!S.settings.mute) Sound.play('tap'); });
  $('#bubble').addEventListener('click', () => Asst.hide());
  if (!location.hash) history.replaceState(null, '', '#home');
  route();
  VoicePack.init().then(() => { if (['lesson','story','settings','studio'].includes(current.name)) renderCurrent(true); });
  loadThree().then(okk => { A3D.init($('#asstStage')); if (!okk) setTimeout(() => toast(t('threeFail'), '🐉', 3600), 1500); });
  if (!storageOk) setTimeout(() => toast(t('storageWarn'), '⚠️', 4200), 800);
  if (!S.tutorialDone) setTimeout(welcome, 450);
  else setTimeout(() => Asst.say(rnd(LINES[L()].greet).replace('{name}', asstName()), {speak:false}), 1400);
  Asst.schedule();
  setTimeout(() => checkUpdate(false), 8000);
  setInterval(() => { if (!document.hidden) checkUpdate(false); }, 30 * 60 * 1000);
}
boot();
</script>
